name: 🏸 羽毛球教程打包部署

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到 GitHub Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGES_REPO: niceaitools/badminton-tutorials
      PAGES_URL: https://niceaitools.github.io/badminton-tutorials/

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          fetch-depth: 0

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm install --no-fund --no-audit

      - name: 🌍 设置环境变量
        run: |
          echo "TZ=Asia/Shanghai" >> "$GITHUB_ENV"
          mkdir -p logs
          if [ -n "${{ vars.PAGES_REPO }}" ]; then
            echo "PAGES_REPO=${{ vars.PAGES_REPO }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.PAGES_URL }}" ]; then
            echo "PAGES_URL=${{ vars.PAGES_URL }}" >> "$GITHUB_ENV"
          fi

      - name: 🏗️ 构建前端
        run: |
          echo "🏗️ 开始构建..." | tee -a logs/fetch.log
          npm run build
          if [ -d dist ]; then
            echo "✅ 构建成功，产物大小:" | tee -a logs/fetch.log
            du -sh dist/ | tee -a logs/fetch.log
            ls -la dist/ | tee -a logs/fetch.log
          else
            echo "❌ 构建失败，未找到 dist" | tee -a logs/fetch.log
            exit 1
          fi
        env:
          NODE_ENV: production

      - name: 🚀 部署到 GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        run: |
          set -euo pipefail
          echo "🚀 开始部署到 GitHub Pages..." | tee -a logs/fetch.log

          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "⚠️ 未配置 DEPLOY_TOKEN，回退 GITHUB_TOKEN（跨仓库推送可能失败）" | tee -a logs/fetch.log
            DEPLOY_TOKEN="${{ github.token }}"
          else
            echo "✅ 使用配置的 DEPLOY_TOKEN" | tee -a logs/fetch.log
          fi

          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/${PAGES_REPO}.git" pages-repo
          cd pages-repo

          git config user.email "action@github.com"
          git config user.name "GitHub Action Bot"

          current_branch=$(git branch --show-current)
          echo "📋 当前分支: $current_branch" | tee -a ../logs/fetch.log
          if [ "$current_branch" != "main" ]; then
            git checkout -b main 2>/dev/null || git checkout main
          fi

          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' ! -name 'README.md' -exec rm -rf {} +

          cp -r ../dist/* .

          touch .nojekyll
          {
            echo "# badminton-tutorials Deploy"
            echo ""
            echo "羽毛球教程 - 自动部署于 $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "访问: ${PAGES_URL}"
          } > README.md

          git add .
          if git diff --cached --quiet; then
            echo "📝 构建产物无变化，跳过部署" | tee -a ../logs/fetch.log
          else
            git commit -m "🚀 自动部署 badminton tutorials - $(date '+%Y-%m-%d %H:%M') [skip ci]"
            echo "📤 强制推送到 GitHub Pages..." | tee -a ../logs/fetch.log
            git push --force origin main
            echo "✅ 部署完成!" | tee -a ../logs/fetch.log
            echo "🌐 访问地址: ${PAGES_URL}" | tee -a ../logs/fetch.log
          fi

          cd ..
          rm -rf pages-repo

      - name: 📋 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: 📊 运行结果总结
        if: always()
        run: |
          echo "=== 🏸 badminton deploy done ===" | tee -a logs/fetch.log
          echo "⏰ $(date)" | tee -a logs/fetch.log
          echo "📊 status: ${{ job.status }}" | tee -a logs/fetch.log
          tail -20 logs/fetch.log || true
